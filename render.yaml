services:
  - type: web
    name: yu-bazaar
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_POOL_SIZE
        value: 3
      - key: DATABASE_MIN_IDLE
        value: 0
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 2525
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: YU Bazaar
      - key: MAIL_SMTP_AUTH
        value: true
      - key: MAIL_STARTTLS
        value: true
      - key: MAIL_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: MAIL_READ_TIMEOUT_MS
        value: 10000
      - key: MAIL_WRITE_TIMEOUT_MS
        value: 10000
      - key: STORAGE_TYPE
        value: s3
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        value: yu-bazaar-images
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
