<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | YU Bazaar</title>

  <!-- Design System Tokens & Components -->
  <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body class="auth-body-wrapper">

<div class="auth-card-container">
  <!-- Brand Header -->
  <div class="auth-brand-header">
    <img th:src="@{/images/YUB_Logo.jpg}" src="/images/YUB_Logo.jpg" alt="YU Bazaar Logo" class="auth-brand-logo">
    <h1 class="auth-brand-title">YU Bazaar</h1>
    <p class="auth-brand-tagline">Open to York community members and public sellers.</p>
  </div>

  <!-- Verification Card -->
  <div class="auth-card">
    <!-- Step Progress Indicator -->
    <div class="step-progress-bar">
      <div class="step-item completed">
        <div class="step-circle">&#10003;</div>
        <span class="step-label">Account Info</span>
      </div>
      <div class="step-item active">
        <div class="step-circle">2</div>
        <span class="step-label">OTP Code</span>
      </div>
      <div class="step-item">
        <div class="step-circle">3</div>
        <span class="step-label">Ready</span>
      </div>
    </div>

    <h2 class="auth-card-title">Verify Your Email</h2>
    <p class="auth-card-subtitle">Enter your email and 6-digit code, or request a new code if you left registration early.</p>

    <!-- Flash Messages -->
    <div class="alert-box alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert-box alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert-box alert-success" th:if="${localOtp}">
      <span>Local verification code: <strong th:text="${localOtp}"></strong></span>
    </div>

    <!-- OTP Form -->
    <form th:action="@{/verify}" method="post">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" th:value="${email}" class="form-input" placeholder="you@example.com" required>
        <div class="form-error" th:if="${emailError}" th:text="${emailError}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="otp">6-Digit Verification Code</label>
        <input type="text" id="otp" name="otp" class="form-input" placeholder="123456" maxlength="10" style="letter-spacing: 4px; font-size: 18px; text-align: center;" required>
        <div class="form-error" th:if="${otpError}" th:text="${otpError}"></div>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary-pill btn-full btn-lg">Verify &amp; Activate Account</button>
      </div>
      <div style="margin-top: 8px;">
        <button type="submit"
                th:formaction="@{/verify/resend}"
                formmethod="post"
                formnovalidate
                class="btn btn-outline-dark btn-full btn-sm">Resend code</button>
      </div>
    </form>
  </div>

  <!-- Bottom Links -->
  <div class="auth-footer-links">
    <div>Didn't receive a code? Check your spam folder.</div>
    <div style="margin-top: 8px;"><a th:href="@{/login}">&larr; Back to Sign In</a></div>
  </div>
</div>

</body>
</html>
