<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Profile | YU Bazaar</title>

  <!-- Design System Tokens & Components -->
  <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
  <style>
    .profile-card-container {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .profile-hero-card {
      background: var(--canvas-light);
      border: 1px solid var(--hairline-light);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-level-3);
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
    }
    .profile-header-flex {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--hairline-light);
    }
    .profile-avatar-large {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-pill);
      background-color: var(--primary-ink);
      color: var(--on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .profile-data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--hairline-light);
      font-size: 15px;
    }
    .profile-data-label {
      color: var(--shade-50);
      font-weight: 500;
    }
    .profile-data-val {
      color: var(--primary-ink);
      font-weight: 600;
    }
  </style>
</head>
<body class="auth-body-wrapper" style="justify-content: flex-start;">

<div class="profile-card-container">
  <!-- Top Navigation Link -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <a th:href="@{/}" href="/" class="btn btn-outline-light btn-sm">
      &larr; Back to Marketplace
    </a>
    <img th:src="@{/images/YUB_Logo.jpg}" src="/images/YUB_Logo.jpg" alt="YU Bazaar Logo" style="height: 32px; border-radius: 6px;">
  </div>

  <!-- Profile Hero Card -->
  <div class="profile-hero-card">
    <div class="profile-header-flex">
      <div class="profile-avatar-large">
        <span th:text="${user.name != null and !user.name.isEmpty() ? #strings.substring(user.name, 0, 1) : 'Y'}">Y</span>
      </div>
      <div>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
          <h1 style="font-family: var(--font-family-display); font-size: 26px; font-weight: 600; color: var(--primary-ink);" th:text="${user.name}">Student Name</h1>
          <span class="badge-verified" th:if="${user.isYorkVerified()}">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            York Verified Student
          </span>
          <span class="badge-public" th:unless="${user.isYorkVerified()}">
            Public Seller
          </span>
        </div>
        <p style="font-size: 14px; color: var(--shade-50);" th:text="${user.email}">student@my.yorku.ca</p>
      </div>
    </div>

    <div class="section-label" style="margin-bottom: 16px;">Account Details</div>

    <div class="profile-data-row">
      <span class="profile-data-label">Full Name</span>
      <span class="profile-data-val" th:text="${user.name}">Jane Doe</span>
    </div>

    <div class="profile-data-row">
      <span class="profile-data-label">Email Address</span>
      <span class="profile-data-val" th:text="${user.email}">student@my.yorku.ca</span>
    </div>

    <div class="profile-data-row" th:if="${user.age}">
      <span class="profile-data-label">Age</span>
      <span class="profile-data-val" th:text="${user.age}">20</span>
    </div>

    <div class="profile-data-row" th:if="${user.gender}">
      <span class="profile-data-label">Gender</span>
      <span class="profile-data-val" th:text="${user.gender}">Female</span>
    </div>

    <div class="profile-data-row">
      <span class="profile-data-label">Seller Verification Status</span>
      <span class="pill-tag pill-tag-mint" th:text="${user.isYorkVerified()} ? 'York Verified Student' : 'Public Seller'">Verified Seller</span>
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 16px; margin-top: 32px;">
      <a th:href="@{/}" href="/" class="btn btn-primary-pill btn-full btn-md">Browse Campus Listings</a>
      <form th:action="@{/logout}" method="post" style="flex-shrink: 0;">
        <button type="submit" class="btn btn-outline-light btn-md">Sign Out</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
