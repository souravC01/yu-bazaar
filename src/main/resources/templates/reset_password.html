<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | YU Bazaar</title>

  <!-- Design System Tokens & Components -->
  <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body class="auth-body-wrapper">

<div class="auth-card-container">
  <!-- Brand Header -->
  <div class="auth-brand-header">
    <img th:src="@{/images/YUB_Logo.jpg}" src="/images/YUB_Logo.jpg" alt="YU Bazaar Logo" class="auth-brand-logo">
    <h1 class="auth-brand-title">YU Bazaar</h1>
    <p class="auth-brand-tagline">The Verified York University Student Marketplace</p>
  </div>

  <!-- Reset Password Card -->
  <div class="auth-card">
    <h2 class="auth-card-title">Choose a New Password</h2>
    <p class="auth-card-subtitle">Ensure your new password has at least 8 characters</p>

    <!-- Error Alert -->
    <div class="alert-box alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Password Form -->
    <form th:if="${token}" th:action="@{/reset-password}" method="post">
      <input type="hidden" name="token" th:value="${token}">

      <div class="form-group">
        <label class="form-label" for="newPassword">New Password (min 8 characters)</label>
        <input type="password" id="newPassword" name="newPassword" minlength="8" class="form-input" autocomplete="new-password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" minlength="8" class="form-input" autocomplete="new-password" placeholder="••••••••" required>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary-pill btn-full btn-lg">Update Password &amp; Continue</button>
      </div>
    </form>

    <div th:unless="${token}" style="text-align: center; padding: 20px 0;">
      <p style="color: var(--shade-50); margin-bottom: 16px;">This password reset link is invalid or has expired.</p>
      <a th:href="@{/forgot-password}" class="btn btn-primary-pill btn-md">Request a New Link</a>
    </div>
  </div>

  <!-- Bottom Links -->
  <div class="auth-footer-links">
    <div><a th:href="@{/forgot-password}">Request another link</a></div>
    <div><a th:href="@{/login}">Back to Sign In</a></div>
  </div>
</div>

</body>
</html>
