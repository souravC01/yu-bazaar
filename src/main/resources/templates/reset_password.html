<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>YU Bazaar - Set New Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      background: #f7f7f7;
      color: #171717;
      font-family: Arial, sans-serif;
    }
    .reset-container {
      width: min(100%, 380px);
      padding: 24px;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #dedede;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 24px;
      text-align: center;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #bcbcbc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      border: 0;
      border-radius: 4px;
      background: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .error {
      margin-bottom: 16px;
      color: #b42318;
      font-size: 14px;
    }
    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #222;
    }
  </style>
</head>
<body>
<main class="reset-container">
  <h1>Set New Password</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>

  <form th:if="${token}" th:action="@{/reset-password}" method="post">
    <input type="hidden" name="token" th:value="${token}">

    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" name="newPassword" minlength="8" autocomplete="new-password" required>

    <label for="confirmNewPassword">Confirm New Password</label>
    <input type="password" id="confirmNewPassword" name="confirmNewPassword" minlength="8" autocomplete="new-password" required>

    <button type="submit">Update Password</button>
  </form>

  <a class="back-link" th:href="@{/forgot-password}">Request Another Link</a>
</main>
</body>
</html>
