<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>YU Bazaar - Password Recovery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      background: #f7f7f7;
      color: #171717;
      font-family: Arial, sans-serif;
    }
    .recovery-container {
      width: min(100%, 380px);
      padding: 24px;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #dedede;
      border-radius: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand img {
      width: 48px;
      height: 48px;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font-size: 24px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #bcbcbc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      border: 0;
      border-radius: 4px;
      background: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .message {
      margin: 0 0 16px;
      font-size: 14px;
    }
    .success { color: #18733d; }
    .error { color: #b42318; }
    .local-link {
      display: block;
      margin: 16px 0;
      overflow-wrap: anywhere;
    }
    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #222;
    }
  </style>
</head>
<body>
<main class="recovery-container">
  <div class="brand">
    <img th:src="@{/images/YUB_Logo.jpg}" alt="YU Bazaar Logo">
    <h1>Password Recovery</h1>
  </div>

  <p class="message success" th:if="${success}" th:text="${success}"></p>
  <p class="message error" th:if="${error}" th:text="${error}"></p>
  <a class="local-link" th:if="${localPasswordResetUrl}" th:href="${localPasswordResetUrl}">Open local password-reset link</a>

  <form th:action="@{/forgot-password}" method="post">
    <label for="email">York Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
    <button type="submit">Request Reset Link</button>
  </form>

  <a class="back-link" th:href="@{/}">Back to Login</a>
</main>
</body>
</html>
