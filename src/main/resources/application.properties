spring.application.name=YU Bazaar
spring.profiles.default=dev
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@yubazaar.local}
app.mail.from-name=${MAIL_FROM_NAME:YU Bazaar}
app.mail.show-local-codes=false
app.storage.type=${STORAGE_TYPE:local}
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
app.storage.s3.endpoint=${R2_ENDPOINT:}
app.storage.s3.region=${R2_REGION:auto}
app.storage.s3.bucket=${R2_BUCKET:}
app.storage.s3.access-key=${R2_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${R2_SECRET_ACCESS_KEY:}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.password-reset.ttl=PT30M
app.verification.ttl=PT10M
app.verification.resend-cooldown=PT60S
app.demo.email=demo@yubazaar.app

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
